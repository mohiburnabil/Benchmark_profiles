<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-white min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-md border border-blue-100">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Create Your Account</h2>

    <form id="registerForm" class="space-y-4">
      <input type="text" name="username" placeholder="Username" required
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">

      <input type="email" name="email" placeholder="Email" required
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">

      <input type="password" name="password" placeholder="Password" required
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition">
        ✍️ Register
      </button>
    </form>

    <div class="mt-6 flex justify-between items-center">
      <a href="login.html"
         class="text-blue-600 hover:underline font-medium">
        🔑 Already have an account?
      </a>
      <a href="index.html"
         class="text-blue-600 hover:underline font-medium">
        ⬅ Back to Home
      </a>
    </div>
  </div>

  <script src="static/js/register.js"></script>
</body>
</html>
