<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <script defer src="static/js/dashboard.js"></script>
</head>
<body class="bg-gray-50 font-sans">
  <header class="bg-white shadow-md py-4 px-8 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-blue-800">Face2Profile Insights Dashboard</h1>
    <nav class="space-x-4">
      <button onclick="window.location.href='leaderboard.html'" class="text-blue-700 hover:text-blue-900 font-semibold">Leaderboard</button>
      <button onclick="logout()" class="text-red-600 hover:text-red-800 font-semibold">Logout</button>
    </nav>
  </header>

  <div class="flex flex-col lg:flex-row min-h-screen">
    <!-- Sidebar Results Card -->
    <aside class="lg:w-1/4 w-full bg-white border-r border-gray-200 p-6 overflow-y-auto shadow-inner" style="max-height: calc(100vh - 80px)">
      <h2 class="text-xl font-bold text-blue-700 mb-4">📊 Your Upload Results</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm text-left text-gray-700">
          <thead class="text-xs text-gray-500 uppercase bg-gray-100">
            <tr>
              <th scope="col" class="px-4 py-2">Score</th>
              <th scope="col" class="px-4 py-2">Uploaded At</th>
            </tr>
          </thead>
          <tbody id="resultsList" class="divide-y divide-gray-200">
            <!-- Rows inserted by JS -->
          </tbody>
        </table>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10">
      <div class="max-w-3xl mx-auto">
        <div class="bg-white shadow-lg rounded-lg p-8 border border-blue-100">
          <h2 class="text-2xl font-bold text-gray-800 mb-6">📂 Upload Your Dataset (CSV)</h2>

          <input type="file" id="csvFile" accept=".csv" class="block w-full mb-6 text-sm text-gray-700 border border-gray-300 rounded p-2 focus:ring focus:ring-blue-200" />

          <button onclick="uploadCSV()" class="bg-blue-700 text-white px-6 py-2 rounded hover:bg-blue-800 transition font-semibold">
            Upload
          </button>

          <div id="uploadFeedback" class="mt-6 text-center text-lg font-medium text-green-600"></div>
        </div>

       <p class="mt-10 text-center text-sm text-gray-500">
  For reference on the required file format, please <a href="static/files/sample.csv" download class="text-blue-600 hover:underline">download the official sample CSV file</a>.
</p>


      </div>
    </main>
  </div>

  <script>
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString(undefined, {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      }) + ' at ' + date.toLocaleTimeString(undefined, {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    async function loadResults() {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      const res = await fetch("http://localhost:8000/user/results", {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (res.status === 401) {
        alert("Session expired or unauthorized. Please log in again.");
        logout();
        return;
      }

      const results = await res.json();
      const list = document.getElementById("resultsList");
      list.innerHTML = "";
      results.forEach(r => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="px-4 py-2 font-medium text-gray-900">${r.score}</td>
          <td class="px-4 py-2 text-gray-700">${formatDate(r.uploaded_at)}</td>
        `;
        list.appendChild(row);
      });
    }
  </script>
</body>
</html>
