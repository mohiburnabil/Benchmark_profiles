<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leaderboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">
  <div class="max-w-3xl mx-auto py-12 px-6">
    <div class="bg-white shadow-lg rounded-xl p-8 border border-blue-100">
      <h2 class="text-3xl font-bold text-center text-blue-700 mb-6">🏆 Leaderboard</h2>

      <!-- Search Input -->
      <div class="mb-4">
        <input type="text" id="searchInput" placeholder="Search by username..." class="w-full px-4 py-2 border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Leaderboard Table -->
      <div class="overflow-x-auto">
        <table class="min-w-full table-auto text-left">
          <thead class="text-xs uppercase bg-blue-100 text-blue-700">
            <tr>
              <th class="px-4 py-2">Rank</th>
              <th class="px-4 py-2">Username</th>
              <th class="px-4 py-2">Score</th>
            </tr>
          </thead>
          <tbody id="leaderboard" class="divide-y divide-gray-200">
            <!-- Entries will be injected here -->
          </tbody>
        </table>
      </div>

      <!-- Pagination Controls -->
      <div class="mt-6 flex justify-center items-center space-x-4">
        <button id="prevBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50" disabled>Previous</button>
        <span id="pageInfo" class="text-gray-700">Page 1</span>
        <button id="nextBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50">Next</button>
      </div>

      <div class="mt-8 text-center">
        <a href="dashboard.html" class="inline-block bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold px-6 py-2 rounded shadow">
          🔙 Back to Dashboard
        </a>
      </div>
    </div>
  </div>

  <script src="static/js/leaderboard.js"></script>
</body>
</html>
